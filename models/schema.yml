version: 2

models:
  - name: Int_Customers
    description: One record per customer
    columns:
      - name: customer_id
        description: Primary key
        data_tests:
          - unique
          - not_null
      - name: first_order_date
        description: NULL when a customer has not yet placed an order.

  - name: Stg_Customer
    description: This model cleans up customer data
    columns:
      - name: id
        description: Primary key
        data_tests:
          - unique
          - not_null

  - name: Stg_Orders
    description: This model cleans up order data
    columns:
      - name: id
        description: Primary key
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                values: ['shipped', 'completed','returned','processing','cancelled'] # ['placed', 'shipped', 'completed', 'return_pending', 'returned']
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('Stg_Customer')
                field: id



